name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages on every
# push to main. Requires the repo's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source).

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so the build-time GitHub contribution graph stays current
  # between pushes. ponytail: GitHub delays scheduled runs under load and
  # auto-disables this cron after 60 days of repo inactivity — if it silently
  # stops, push any commit or run it manually to re-arm.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate the deploy. Without these, format, lint, and type drift lands on
      # the live site silently, which is how the repo ended up with nine
      # unformatted files on main and a linter that had been aborting on a
      # config parse error for months.
      #
      # --deny-warnings because the repo currently lints clean: a warning here
      # means something new, and a gate that tolerates a growing pile of them
      # stops being a gate.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint --deny-warnings

      - name: Typecheck
        run: pnpm typecheck

      - name: Build static export
        run: pnpm build

      # Pages' artifact deploy doesn't run Jekyll, but .nojekyll keeps the
      # _next/ directory safe under any future branch-based serving too.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
